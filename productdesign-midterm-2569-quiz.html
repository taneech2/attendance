<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ข้อสอบกลางภาค 1/2569 — งานออกแบบผลิตภัณฑ์</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap');
:root{--bg:#0a0a0f;--card:#12121a;--line:#232333;--cy:#22d3ee;--cyd:#0891b2;--tx:#e6e6f0;--mut:#8a8aa0;--rd:#f43f5e;--gr:#22c55e;--yw:#facc15;--pp:#a78bfa;--r:16px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Sarabun',sans-serif;color:var(--tx);min-height:100vh;
  background:
    linear-gradient(rgba(34,211,238,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(34,211,238,.05) 1px,transparent 1px),
    linear-gradient(160deg,#0a0a0f 0%,#0d1420 100%);
  background-size:28px 28px,28px 28px,100% 100%;
}
.wrap{max-width:760px;margin:0 auto;padding:20px}
.screen{display:none}
.screen.active{display:block}

/* LOGIN */
#s-login{align-items:center;justify-content:center;min-height:100vh;padding:12px}
#s-login.active{display:flex}
.login-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px 24px;width:100%;max-width:440px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.login-emblem{font-size:44px;text-align:center;margin-bottom:6px}
.login-h1{text-align:center;font-size:20px;font-weight:800;color:var(--cy);line-height:1.4}
.login-sub{text-align:center;font-size:13px;color:var(--mut);margin:4px 0 18px}
.rules-box{background:#0d1a1e;border:1px solid var(--cyd);border-radius:10px;padding:12px 14px;margin-bottom:18px;font-size:13px;line-height:1.9;color:var(--cy)}
.rules-box b{color:var(--yw)}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:#aab;margin-bottom:6px}
.field input{width:100%;background:#1a1a26;border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--tx);font-family:'Sarabun',sans-serif;font-size:14px}
.field input:focus{outline:none;border-color:var(--cy)}
.btn-primary{display:block;width:100%;background:linear-gradient(135deg,var(--cyd),var(--cy));color:#001;border:none;border-radius:10px;padding:14px;font-size:17px;font-weight:800;font-family:'Sarabun',sans-serif;cursor:pointer;margin-top:6px}
.btn-primary:active{transform:scale(.98)}
.btn-ghost{display:block;width:100%;background:none;border:1px solid var(--line);color:var(--mut);border-radius:10px;padding:10px;font-size:13px;font-weight:700;font-family:'Sarabun',sans-serif;cursor:pointer;margin-top:10px}

/* EXAM TOPBAR */
.topbar{position:sticky;top:0;z-index:50;background:rgba(10,10,15,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:16px}
.topbar-inner{max-width:760px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.topbar h1{font-size:15px;color:var(--cy);font-weight:800}
.topbar .sub{font-size:11px;color:var(--mut)}
.timer{display:flex;align-items:center;gap:8px}
.timer-num{font-size:20px;font-weight:800;color:var(--gr);font-variant-numeric:tabular-nums;background:#0d1a1e;border:1px solid var(--cyd);border-radius:8px;padding:4px 12px}
.timer-num.warn{color:var(--yw);border-color:var(--yw)}
.timer-num.danger{color:var(--rd);border-color:var(--rd);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.btn-submit{background:var(--rd);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-family:'Sarabun',sans-serif;font-size:13px;font-weight:800;cursor:pointer}

/* NAVIGATOR */
.navgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-bottom:18px}
.navbtn{aspect-ratio:1;border-radius:6px;border:1.5px solid var(--line);background:#161622;color:var(--mut);font-size:11px;font-weight:700;font-family:'Sarabun',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center}
.navbtn.answered{background:rgba(34,211,238,.15);border-color:var(--cyd);color:var(--cy)}
.navbtn.current{border-color:var(--yw);color:var(--yw);box-shadow:0 0 0 2px rgba(250,204,21,.3)}

/* QUESTION CARD */
.quiz-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 20px;max-width:720px;margin:0 auto 20px}
.q-badge{display:inline-block;font-size:11px;font-weight:800;border-radius:20px;padding:4px 12px;margin-bottom:10px;color:#001}
.q-num{font-size:12px;color:var(--mut);margin-bottom:4px}
.q-text{font-size:16px;font-weight:700;line-height:1.65;margin-bottom:16px;min-height:50px}
.choices{display:grid;gap:9px;margin-bottom:18px}
.choice-btn{display:flex;align-items:center;gap:11px;background:#161622;border:2px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer;text-align:left;font-family:'Sarabun',sans-serif;font-size:14px;font-weight:600;color:var(--tx);width:100%;transition:.12s}
.choice-btn:active{transform:scale(.98)}
.choice-ltr{width:26px;height:26px;background:var(--cyd);color:#001;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.choice-btn.sel{background:rgba(34,211,238,.12);border-color:var(--cy)}
.choice-btn.sel .choice-ltr{background:var(--cy)}
.nav-row{display:flex;gap:10px}
.btn-nav{flex:1;background:#1a1a26;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:13px;font-size:14px;font-weight:800;font-family:'Sarabun',sans-serif;cursor:pointer}
.btn-nav.primary{background:var(--cyd);border-color:var(--cyd);color:#001}
.btn-nav:disabled{opacity:.4;cursor:default}

/* RESULT */
.result-emoji{font-size:56px;text-align:center;margin-bottom:6px}
.result-score{text-align:center;font-size:34px;font-weight:800;color:var(--cy);margin-bottom:2px}
.result-pct{text-align:center;font-size:14px;color:var(--mut);margin-bottom:20px}
.result-who{text-align:center;font-size:14px;color:var(--tx);margin-bottom:20px}
.sec-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:8px}
.sec-bar-wrap{background:#1a1a26;border-radius:20px;height:10px;overflow:hidden;flex:1;margin:0 10px}
.sec-bar{height:100%;border-radius:20px}
.sec-label{width:130px;color:var(--mut);flex-shrink:0}
.sec-val{width:70px;text-align:right;color:var(--tx);font-weight:700;flex-shrink:0}

/* REPORT */
.report-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;max-width:100%;overflow-x:auto}
.report-tools{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.report-tools input{flex:1;min-width:160px;background:#1a1a26;border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--tx);font-family:'Sarabun',sans-serif;font-size:13px}
.report-tools button{background:#1a1a26;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:9px 14px;font-family:'Sarabun',sans-serif;font-size:13px;font-weight:700;cursor:pointer}
table.rpt{width:100%;border-collapse:collapse;font-size:13px;min-width:900px}
table.rpt th{text-align:left;color:var(--mut);font-weight:700;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.rpt td{padding:8px;border-bottom:1px solid #1a1a26;white-space:nowrap}
table.rpt tr:hover td{background:#161622}
.rpt-total{color:var(--cy);font-weight:800}
.rpt-empty{text-align:center;color:var(--mut);padding:30px;font-size:13px}
.rpt-cert-btn{background:var(--cyd);color:#001;border:none;border-radius:6px;padding:5px 10px;font-family:'Sarabun',sans-serif;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
.rpt-cert-btn:active{transform:scale(.96)}

/* GRADE */
.result-grade{text-align:center;margin-bottom:16px}
.grade-badge{display:inline-block;border-radius:20px;padding:6px 18px;font-size:15px;font-weight:800}
.grade-badge.g4{background:rgba(34,197,94,.15);color:var(--gr);border:1.5px solid var(--gr)}
.grade-badge.g3{background:rgba(34,211,238,.15);color:var(--cy);border:1.5px solid var(--cyd)}
.grade-badge.g2{background:rgba(250,204,21,.15);color:var(--yw);border:1.5px solid var(--yw)}
.grade-badge.g1{background:rgba(251,146,60,.15);color:#fb923c;border:1.5px solid #fb923c}
.grade-badge.g0{background:rgba(244,63,94,.15);color:var(--rd);border:1.5px solid var(--rd)}
.rpt-grade{font-weight:800}
.rpt-grade.g4{color:var(--gr)}
.rpt-grade.g3{color:var(--cy)}
.rpt-grade.g2{color:var(--yw)}
.rpt-grade.g1{color:#fb923c}
.rpt-grade.g0{color:var(--rd)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="s-login" class="screen active">
  <div class="login-card">
    <div class="login-emblem" id="loginEmblem">🎨</div>
    <div class="login-h1" id="loginH1">ข้อสอบกลางภาค 1/2569<br>วิชางานออกแบบผลิตภัณฑ์</div>
    <div class="login-sub" id="loginSub">รหัสวิชา 20103-2028</div>
    <div class="rules-box" id="rulesBox"></div>
    <div class="field"><label>ชื่อ (First Name)</label><input id="fname" placeholder="กรอกชื่อ..."></div>
    <div class="field"><label>นามสกุล (Last Name)</label><input id="lname" placeholder="กรอกนามสกุล..."></div>
    <div class="field"><label>แผนก / ชั้นปี (Department / Class)</label><input id="dept" placeholder="เช่น ช่างกล 1/1..."></div>
    <button class="btn-primary" onclick="startExam()">🚀 เริ่มสอบ</button>
    <button class="btn-ghost" onclick="openReport()">📊 รายงานผลสอบ (สำหรับครู)</button>
  </div>
</div>

<!-- EXAM -->
<div id="s-exam" class="screen">
  <div class="topbar">
    <div class="topbar-inner">
      <div>
        <h1 id="examTopbarTitle">ข้อสอบกลางภาค 1/2569</h1>
        <div class="sub" id="examWho"></div>
      </div>
      <div class="timer">
        <div class="timer-num" id="timerNum">2:00:00</div>
        <button class="btn-submit" onclick="confirmSubmit()">ส่งข้อสอบ</button>
      </div>
    </div>
  </div>
  <div class="wrap">
    <div class="navgrid" id="navgrid"></div>
    <div class="quiz-card">
      <div class="q-badge" id="qBadge"></div>
      <div class="q-num" id="qNum"></div>
      <div class="q-text" id="qText"></div>
      <div class="choices" id="qChoices"></div>
      <div class="nav-row">
        <button class="btn-nav" id="btnPrev" onclick="gotoQ(currentQ-1)">← ข้อก่อนหน้า</button>
        <button class="btn-nav primary" id="btnNext" onclick="gotoQ(currentQ+1)">ข้อถัดไป →</button>
      </div>
    </div>
  </div>
</div>

<!-- RESULT -->
<div id="s-result" class="screen">
  <div class="wrap">
    <div class="quiz-card">
      <div class="result-emoji" id="rEmoji">🏆</div>
      <div class="result-score" id="rScore"></div>
      <div class="result-pct" id="rPct"></div>
      <div class="result-grade" id="rGrade"></div>
      <div class="result-who" id="rWho"></div>
      <div id="rBreakdown"></div>
      <button class="btn-primary" id="btnCert" style="display:none;margin-top:6px" onclick="downloadCertificate()">🎓 ดาวน์โหลดใบประกาศ</button>
      <button class="btn-primary" onclick="location.reload()" style="margin-top:10px">🔄 กลับหน้าแรก</button>
    </div>
  </div>
</div>
<canvas id="certCanvas" width="1400" height="990" style="display:none"></canvas>

<!-- REPORT -->
<div id="s-report" class="screen">
  <div class="wrap">
    <div class="topbar" style="position:static;margin-bottom:16px;padding:0">
      <div class="topbar-inner" style="padding:0">
        <h1 style="font-size:18px">📊 รายงานผลสอบ — กลางภาค 1/2569</h1>
        <button class="btn-nav" style="flex:none" onclick="backToLogin()">← กลับหน้าแรก</button>
      </div>
    </div>
    <div class="report-card">
      <div class="report-tools">
        <input id="rptFilter" placeholder="ค้นหาชื่อ / แผนก..." oninput="renderReport()">
        <button onclick="loadReport()">🔄 รีเฟรช</button>
        <button onclick="downloadCSV()">⬇️ ดาวน์โหลด CSV</button>
      </div>
      <div id="rptTableWrap"><div class="rpt-empty">กำลังโหลด...</div></div>
    </div>
  </div>
</div>

document.getElementById('loginEmblem').textContent = EXAM_EMOJI;
document.getElementById('loginH1').innerHTML = `ข้อสอบกลางภาค 1/2569<br>${SUBJECT_NAME}`;

const MASTER_QUESTIONS = SECTIONS.flatMap(s => s.list.map(q => ({...q, sec: s.key, secTH: s.label, color: s.color})));
const N = MASTER_QUESTIONS.length;
const PT_PER_Q = 200 / N;
const TOTAL_TOPICS = SECTIONS.length;

document.getElementById('rulesBox').innerHTML = `
  • ข้อสอบทั้งหมด <b>${N} ข้อ</b> (${TOTAL_TOPICS} หัวข้อ)<br>
  • คะแนนเต็ม <b>200 คะแนน</b><br>
  • เวลาสอบ <b>${(EXAM_SECONDS/3600).toFixed(0)} ชั่วโมง</b> — หมดเวลาระบบจะส่งข้อสอบให้อัตโนมัติ<br>
  • สอบเสร็จ ระบบแสดงผลคะแนนทันที`;

function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function buildExamQuestions(){
  const out = [];
  SECTIONS.forEach(({key, label, color, list})=>{
    shuffled(list).forEach(q=>{
      const order = shuffled([0,1,2,3]);
      out.push({
        q: q.q,
        c: order.map(origIdx=>q.c[origIdx]),
        a: order.indexOf(q.a),
        sec: key, secTH: label, color,
      });
    });
  });
  return out;
}
let examQuestions = MASTER_QUESTIONS;

function gradeOf(pct){
  if(pct >= 80) return {n:4, label:'เกรด 4', pass:true};
  if(pct >= 70) return {n:3, label:'เกรด 3', pass:true};
  if(pct >= 60) return {n:2, label:'เกรด 2', pass:true};
  if(pct >= 50) return {n:1, label:'เกรด 1', pass:true};
  return {n:0, label:'เกรด 0 (ไม่ผ่าน)', pass:false};
}

let student = null;
let answers = new Array(N).fill(-1);
let currentQ = 0;
let timeLeft = EXAM_SECONDS;
let timerInterval = null;
let submitted = false;

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startExam(){
  const fname = document.getElementById('fname').value.trim();
  const lname = document.getElementById('lname').value.trim();
  const dept = document.getElementById('dept').value.trim();
  if(!fname || !lname || !dept){ alert('กรุณากรอก ชื่อ นามสกุล และแผนก ให้ครบ'); return; }
  student = {fname, lname, dept};
  document.getElementById('examWho').textContent = `${fname} ${lname} — ${dept}`;
  examQuestions = buildExamQuestions();
  buildNavGrid();
  gotoQ(0);
  show('s-exam');
  timeLeft = EXAM_SECONDS;
  updateTimerDisplay();
  timerInterval = setInterval(tick, 1000);
  window.addEventListener('beforeunload', beforeUnload);
}

function beforeUnload(e){
  if(!submitted){ e.preventDefault(); e.returnValue=''; }
}

function tick(){
  timeLeft--;
  updateTimerDisplay();
  if(timeLeft <= 0){ doSubmit(); }
}

function updateTimerDisplay(){
  const h = Math.floor(timeLeft/3600), m = Math.floor((timeLeft%3600)/60), s = timeLeft%60;
  const el = document.getElementById('timerNum');
  el.textContent = `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  el.classList.toggle('warn', timeLeft <= 600 && timeLeft > 120);
  el.classList.toggle('danger', timeLeft <= 120);
}

function buildNavGrid(){
  const grid = document.getElementById('navgrid');
  grid.innerHTML = '';
  for(let i=0;i<N;i++){
    const b = document.createElement('button');
    b.className = 'navbtn';
    b.id = 'nav'+i;
    b.textContent = i+1;
    b.onclick = ()=>gotoQ(i);
    grid.appendChild(b);
  }
}
function refreshNavGrid(){
  for(let i=0;i<N;i++){
    const b = document.getElementById('nav'+i);
    b.classList.toggle('answered', answers[i] !== -1);
    b.classList.toggle('current', i === currentQ);
  }
}

function gotoQ(i){
  if(i<0 || i>=N) return;
  currentQ = i;
  const item = examQuestions[i];
  const badge = document.getElementById('qBadge');
  badge.textContent = item.secTH;
  badge.style.background = item.color;
  document.getElementById('qNum').textContent = `ข้อที่ ${i+1} / ${N}`;
  document.getElementById('qText').textContent = item.q;
  const wrap = document.getElementById('qChoices');
  wrap.innerHTML = '';
  const letters = ['ก','ข','ค','ง'];
  item.c.forEach((choice, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'choice-btn' + (answers[i]===idx ? ' sel' : '');
    btn.innerHTML = `<span class="choice-ltr">${letters[idx]}</span><span>${choice}</span>`;
    btn.onclick = ()=>{ answers[i]=idx; gotoQ(i); };
    wrap.appendChild(btn);
  });
  document.getElementById('btnPrev').disabled = (i===0);
  document.getElementById('btnNext').textContent = (i===N-1) ? '✓ ไปหน้าส่งข้อสอบ' : 'ข้อถัดไป →';
  document.getElementById('btnNext').onclick = (i===N-1) ? confirmSubmit : ()=>gotoQ(currentQ+1);
  refreshNavGrid();
}

function confirmSubmit(){
  const unanswered = answers.filter(a=>a===-1).length;
  const msg = unanswered>0
    ? `ยังมีข้อที่ยังไม่ได้ตอบ ${unanswered} ข้อ ยืนยันส่งข้อสอบหรือไม่?`
    : 'ยืนยันส่งข้อสอบหรือไม่?';
  if(confirm(msg)) doSubmit();
}

async function doSubmit(){
  if(submitted) return;
  submitted = true;
  clearInterval(timerInterval);
  window.removeEventListener('beforeunload', beforeUnload);

  const secCorrect = {};
  SECTIONS.forEach(s=> secCorrect[s.key] = 0);
  examQuestions.forEach((item, i)=>{ if(answers[i] === item.a) secCorrect[item.sec]++; });

  const totalCorrect = SECTIONS.reduce((sum,s)=> sum + secCorrect[s.key], 0);
  const totalPts = +(totalCorrect * PT_PER_Q).toFixed(1);
  const scores = {};
  SECTIONS.forEach(s=> scores[s.key] = +(secCorrect[s.key] * PT_PER_Q).toFixed(1));
  const pct = +(totalPts/200*100).toFixed(1);
  const usedSec = EXAM_SECONDS - Math.max(timeLeft,0);

  const grade = gradeOf(pct);
  const record = {
    fname: student.fname, lname: student.lname, dept: student.dept,
    scores: scores,
    total: totalPts, pct: pct,
    gradeN: grade.n, gradeLabel: grade.label, pass: grade.pass,
    usedSec: usedSec,
    submittedAt: Date.now(),
  };

  try{
    await fetch(RESULTS_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(record)});
  }catch(e){ /* เก็บผลไว้แสดงในเครื่องได้แม้ส่งขึ้นเซิร์ฟเวอร์ไม่สำเร็จ */ }

  showResult(record);
}

let lastResult = null;
function showResult(r){
  lastResult = r;
  document.getElementById('rScore').textContent = `${r.total} / 200 คะแนน`;
  document.getElementById('rPct').textContent = `คิดเป็น ${r.pct}%`;
  document.getElementById('rWho').textContent = `${r.fname} ${r.lname} — ${r.dept}`;
  document.getElementById('rGrade').innerHTML = `<span class="grade-badge g${r.gradeN}">${r.pass ? '✅' : '❌'} ${r.gradeLabel}</span>`;
  document.getElementById('rEmoji').textContent = r.pct>=80 ? '🏆' : r.pct>=50 ? '👍' : '📘';
  document.getElementById('rBreakdown').innerHTML = SECTIONS.map(s=>{
    const val = r.scores[s.key];
    const maxThisSec = +(s.list.length * PT_PER_Q).toFixed(1);
    return `
    <div class="sec-row">
      <div class="sec-label">${s.label}</div>
      <div class="sec-bar-wrap"><div class="sec-bar" style="width:${(val/maxThisSec*100)}%;background:${s.color}"></div></div>
      <div class="sec-val">${val} / ${maxThisSec}</div>
    </div>`;
  }).join('');
  document.getElementById('btnCert').style.display = r.pass ? 'block' : 'none';
  show('s-result');
}

// ─── CERTIFICATE (ออกให้อัตโนมัติเมื่อสอบผ่าน) ─────────
async function downloadCertificate(overrideResult){
  const r = overrideResult || lastResult;
  if(!r || !r.pass) return;
  // ใช้ Web Share API (แชร์ไฟล์ตรง) เป็นหลักถ้ารองรับ — เชื่อถือได้สุดบนมือถือ ไม่ติดปัญหา popup/download attribute/in-app browser
  const canWebShareFile = (() => {
    try { return !!(navigator.canShare && navigator.share && navigator.canShare({files:[new File([''], 't.png', {type:'image/png'})]})); }
    catch(e){ return false; }
  })();
  // ถ้าไม่รองรับ Web Share ค่อยเปิดแท็บใหม่แบบ synchronous ก่อน await ใดๆ (กันมือถือบล็อก popup)
  const certWindow = canWebShareFile ? null : window.open('', '_blank');
  if(document.fonts && document.fonts.ready){ try{ await document.fonts.ready; }catch(e){} }

  const canvas = document.getElementById('certCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  ctx.fillStyle = '#fdfaf3';
  ctx.fillRect(0,0,W,H);

  ctx.strokeStyle = '#0b2d4a';
  ctx.lineWidth = 10;
  ctx.strokeRect(30,30,W-60,H-60);
  ctx.strokeStyle = '#c9a227';
  ctx.lineWidth = 3;
  ctx.strokeRect(50,50,W-100,H-100);

  ctx.textAlign = 'center';

  ctx.fillStyle = '#0b2d4a';
  ctx.font = "800 60px 'Sarabun', sans-serif";
  ctx.fillText('ใบประกาศเกียรติคุณ', W/2, 175);
  ctx.fillStyle = '#c9a227';
  ctx.font = "700 24px 'Sarabun', sans-serif";
  ctx.fillText('CERTIFICATE OF ACHIEVEMENT', W/2, 215);

  ctx.fillStyle = '#333';
  ctx.font = "400 26px 'Sarabun', sans-serif";
  ctx.fillText('มอบให้เพื่อแสดงว่า', W/2, 300);

  ctx.fillStyle = '#0b2d4a';
  ctx.font = "800 52px 'Sarabun', sans-serif";
  ctx.fillText(`${r.fname} ${r.lname}`, W/2, 375);
  ctx.strokeStyle = '#c9a227';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(W/2-260,400); ctx.lineTo(W/2+260,400); ctx.stroke();

  ctx.fillStyle = '#333';
  ctx.font = "400 24px 'Sarabun', sans-serif";
  ctx.fillText(`แผนก / ชั้นปี ${r.dept}`, W/2, 445);

  ctx.font = "400 26px 'Sarabun', sans-serif";
  const bodyLines = [
    'ได้สอบผ่านการทดสอบกลางภาคเรียนที่ 1 ปีการศึกษา 2569',
    CERT_BODY_LINE2,
  ];
  bodyLines.forEach((line,i)=> ctx.fillText(line, W/2, 495 + i*38));

  ctx.fillStyle = '#0b2d4a';
  ctx.font = "700 30px 'Sarabun', sans-serif";
  ctx.fillText(`คะแนน ${r.total} / 200 (${r.pct}%)  —  ${r.gradeLabel}`, W/2, 605);

  const dateTH = new Date(r.submittedAt || Date.now()).toLocaleDateString('th-TH-u-ca-buddhist', {day:'numeric', month:'long', year:'numeric'});
  ctx.fillStyle = '#555';
  ctx.font = "400 22px 'Sarabun', sans-serif";
  ctx.fillText(`ให้ไว้ ณ วันที่ ${dateTH}`, W/2, 660);

  try{
    const sigImg = new Image();
    await new Promise((res, rej) => { sigImg.onload = res; sigImg.onerror = rej; sigImg.src = 'data:image/png;base64,' + SIGNATURE_PNG_B64; });
    const sigW = 210, sigH = sigW * (sigImg.naturalHeight / sigImg.naturalWidth);
    ctx.globalCompositeOperation = 'multiply';
    ctx.drawImage(sigImg, W/2 - sigW/2, 840 - sigH - 8, sigW, sigH);
    ctx.globalCompositeOperation = 'source-over';
  }catch(e){ /* ไม่มีรูปลายเซ็น ใช้เส้นว่างแทน */ }

  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(W/2-190,840); ctx.lineTo(W/2+190,840); ctx.stroke();
  ctx.fillStyle = '#0b2d4a';
  ctx.font = "700 24px 'Sarabun', sans-serif";
  ctx.fillText('(นายธานี ชมสุข)', W/2, 875);
  ctx.fillStyle = '#555';
  ctx.font = "400 20px 'Sarabun', sans-serif";
  ctx.fillText('ครูผู้สอน วิทยาลัยการอาชีพบุรีรัมย์', W/2, 905);

  const fileName = `certificate-${DOWNLOAD_PREFIX}-${r.fname}-${r.lname}.png`;
  const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));

  if(canWebShareFile){
    try{
      await navigator.share({files:[new File([blob], fileName, {type:'image/png'})], title:'ใบประกาศเกียรติคุณ', text: `${r.fname} ${r.lname}`});
    }catch(e){ /* ผู้ใช้กดยกเลิกการแชร์ หรือแชร์ไม่สำเร็จ — ถือเป็นการตัดสินใจของผู้ใช้ ไม่ต้องทำอะไรเพิ่ม */ }
    return;
  }

  const blobUrl = URL.createObjectURL(blob);
  if(certWindow){
    certWindow.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>ใบประกาศ - ${r.fname} ${r.lname}</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{margin:0;background:#111;font-family:'Sarabun',sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px 12px 40px}p{color:#fff;text-align:center;margin:0 0 14px;font-size:15px;line-height:1.8}img{max-width:100%;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.5)}</style></head><body><p>📱 มือถือ: แตะค้างที่รูปด้านล่าง แล้วเลือก "บันทึกรูปภาพ"<br>💻 คอมพิวเตอร์: คลิกขวาที่รูป แล้วเลือก "บันทึกรูปภาพเป็น"</p><img src="${blobUrl}" alt="certificate"></body></html>`);
    certWindow.document.close();
  }else{
    const link = document.createElement('a');
    link.download = fileName;
    link.href = blobUrl;
    link.click();
    alert('เบราว์เซอร์บล็อกการเปิดหน้าต่างใหม่ กรุณาอนุญาต Pop-up ของเว็บนี้แล้วลองใหม่');
  }
}

// ─── REPORT (สำหรับครู) ───────────────────────────────
let reportData = [];
let currentReportRows = [];
function downloadCertificateForRow(i){ downloadCertificate(currentReportRows[i]); }
function openReport(){
  const pin = prompt('กรุณาใส่รหัสผ่านสำหรับครู เพื่อดูรายงานผลสอบ:');
  if(pin !== REPORT_PIN){ if(pin!==null) alert('รหัสผ่านไม่ถูกต้อง'); return; }
  show('s-report');
  loadReport();
}
function backToLogin(){ show('s-login'); }

async function loadReport(){
  document.getElementById('rptTableWrap').innerHTML = '<div class="rpt-empty">กำลังโหลด...</div>';
  try{
    const res = await fetch(RESULTS_URL, {cache:'no-store'});
    const data = await res.json();
    reportData = data ? Object.values(data).sort((a,b)=>b.submittedAt-a.submittedAt) : [];
  }catch(e){
    reportData = [];
    document.getElementById('rptTableWrap').innerHTML = '<div class="rpt-empty">โหลดข้อมูลไม่สำเร็จ ตรวจสอบการเชื่อมต่ออินเทอร์เน็ต</div>';
    return;
  }
  renderReport();
}

function renderReport(){
  const filter = document.getElementById('rptFilter').value.trim().toLowerCase();
  const rows = reportData.filter(r=>{
    if(!filter) return true;
    return (`${r.fname} ${r.lname} ${r.dept}`).toLowerCase().includes(filter);
  });
  const wrap = document.getElementById('rptTableWrap');
  if(rows.length === 0){
    wrap.innerHTML = '<div class="rpt-empty">ยังไม่มีนักเรียนสอบ หรือไม่พบข้อมูลที่ค้นหา</div>';
    return;
  }
  const fmtTime = ts => new Date(ts).toLocaleString('th-TH', {dateStyle:'short', timeStyle:'short'});
  const gradeFor = r => r.gradeN != null ? {n:r.gradeN, label:r.gradeLabel} : (()=>{ const g=gradeOf(r.pct); return {n:g.n, label:g.label}; })();
  currentReportRows = rows;
  wrap.innerHTML = `<table class="rpt"><thead><tr>
    <th>เวลาส่ง</th><th>ชื่อ-สกุล</th><th>แผนก</th>${SECTIONS.map(s=>`<th>${s.label}</th>`).join('')}<th>รวม</th><th>%</th><th>เกรด</th><th>ใบประกาศ</th>
  </tr></thead><tbody>
  ${rows.map((r,i)=>{ const g = gradeFor(r); return `<tr>
    <td>${fmtTime(r.submittedAt)}</td>
    <td>${r.fname} ${r.lname}</td>
    <td>${r.dept}</td>
    ${SECTIONS.map(s=>`<td>${r.scores ? r.scores[s.key] : ''}</td>`).join('')}
    <td class="rpt-total">${r.total}</td>
    <td>${r.pct}%</td>
    <td class="rpt-grade g${g.n}">${g.label}</td>
    <td>${r.pass ? `<button class="rpt-cert-btn" onclick="downloadCertificateForRow(${i})">🎓 ดาวน์โหลด</button>` : '—'}</td>
  </tr>`; }).join('')}
  </tbody></table>
  <div style="margin-top:10px;font-size:12px;color:var(--mut)">ทั้งหมด ${rows.length} รายการ — เกณฑ์ผ่าน: 50% ขึ้นไป (เกรด 1-4)</div>`;
}

function downloadCSV(){
  if(reportData.length === 0){ alert('ยังไม่มีข้อมูลให้ดาวน์โหลด'); return; }
  const header = ['เวลาส่ง','ชื่อ','นามสกุล','แผนก', ...SECTIONS.map(s=>s.label), 'รวม','เปอร์เซ็นต์','เกรด'];
  const lines = [header.join(',')];
  reportData.forEach(r=>{
    const ts = new Date(r.submittedAt).toLocaleString('th-TH');
    const gradeLabel = r.gradeLabel != null ? r.gradeLabel : gradeOf(r.pct).label;
    const secVals = SECTIONS.map(s=> r.scores ? r.scores[s.key] : '');
    lines.push([ts, r.fname, r.lname, r.dept, ...secVals, r.total, r.pct, gradeLabel].map(v=>`"${v}"`).join(','));
  });
  const blob = new Blob(['﻿'+lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `exam-report-${DOWNLOAD_PREFIX}-2569.csv`;
  a.click();
  URL.revokeObjectURL(url);
}
