<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ระบบส่งกำลังและความเร็วรอบ — สัปดาห์ 10-14</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap');
:root{--bg:#0a0a0f;--card:#12121a;--line:#232333;--cy:#22d3ee;--cyd:#0891b2;--tx:#e6e6f0;--mut:#8a8aa0;--rd:#f43f5e;--gr:#22c55e;--yw:#facc15;--r:16px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Sarabun',sans-serif;color:var(--tx);min-height:100vh;
  background:
    linear-gradient(rgba(34,211,238,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(34,211,238,.05) 1px,transparent 1px),
    linear-gradient(160deg,#0a0a0f 0%,#0d1420 100%);
  background-size:28px 28px,28px 28px,100% 100%;
}
.wrap{max-width:960px;margin:0 auto;padding:20px}
.screen{display:none}
.screen.active{display:block}

/* LOGIN */
#s-login{align-items:center;justify-content:center;min-height:100vh;padding:12px}
#s-login.active{display:flex}
.login-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px 24px;width:100%;max-width:420px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.login-h1{text-align:center;font-size:22px;font-weight:800;color:var(--cy)}
.login-sub{text-align:center;font-size:13px;color:var(--mut);margin:4px 0 20px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:#aab;margin-bottom:6px}
.field input{width:100%;background:#1a1a26;border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--tx);font-family:'Sarabun',sans-serif;font-size:14px}
.field input:focus{outline:none;border-color:var(--cy)}
.btn-primary{display:block;width:100%;background:linear-gradient(135deg,var(--cyd),var(--cy));color:#001;border:none;border-radius:10px;padding:14px;font-size:17px;font-weight:800;font-family:'Sarabun',sans-serif;cursor:pointer;margin-top:6px}
.btn-primary:active{transform:scale(.98)}

/* HEADER */
.topbar{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
.topbar h1{font-size:22px;color:var(--cy);font-weight:800}
.topbar .sub{font-size:13px;color:var(--mut);margin-top:2px}
.nav-btns{display:flex;gap:8px}
.nav-btn{border:1px solid var(--line);background:#1a1a26;color:var(--tx);padding:9px 16px;border-radius:8px;font-family:'Sarabun',sans-serif;font-size:14px;font-weight:700;cursor:pointer}
.nav-btn.on{border-color:var(--cy);color:var(--cy);background:rgba(34,211,238,.1)}

/* WEEK TABS */
.week-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.week-tab{border:1px solid var(--line);background:#1a1a26;color:var(--tx);padding:10px 16px;border-radius:20px;font-family:'Sarabun',sans-serif;font-size:14px;font-weight:700;cursor:pointer;text-align:center}
.week-tab.on{background:var(--cyd);border-color:var(--cyd);color:#001}
.week-title{font-size:16px;font-weight:700;color:var(--cy);margin-bottom:2px}
.week-desc{font-size:13px;color:var(--mut);margin-bottom:18px}

/* INTERACTIVE SIMULATOR */
.sim-panel{background:var(--card);border:1px solid var(--cyd);border-radius:12px;padding:18px;margin-bottom:20px}
.sim-panel h3{color:var(--cy);font-size:16px;margin-bottom:12px}
.sim-body{display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.sim-svg{width:260px;height:260px;flex-shrink:0;background:#0a0a12;border-radius:10px;border:1px solid var(--line);touch-action:none}
.sim-controls{flex:1;min-width:220px;display:flex;flex-direction:column;gap:14px}
.sim-controls label{font-size:13px;color:#aab;display:block}
.sim-controls label b{color:var(--cy)}
.sim-controls input[type=range]{width:100%;margin-top:6px;accent-color:var(--cy)}
.sim-readout{background:#0d1a1e;border:1px solid var(--cyd);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--cy);line-height:1.8}
.sim-check{display:flex;align-items:center;gap:8px;font-size:13px;color:#aab}
.sim-hint{font-size:12px;color:var(--mut);margin-top:-6px}

/* LEARN CARDS */
.topic-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.topic-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.topic-card h3{color:var(--cy);font-size:16px;margin-bottom:8px}
.topic-desc{font-size:13px;color:var(--mut);margin-bottom:10px;line-height:1.6}
.formula-box{background:#0d1a1e;border:1px solid var(--cyd);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--cy);margin-bottom:8px;line-height:1.7}
.example-box{background:#161622;border-radius:8px;padding:10px 12px;font-size:13px;color:#bbc;line-height:1.7}
.example-box b{color:var(--gr)}

/* QUIZ PRE-SCREEN */
.quiz-cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.quiz-cat-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;cursor:pointer;text-align:center}
.quiz-cat-card:hover{border-color:var(--cy)}
.quiz-cat-card h3{color:var(--cy);font-size:17px;margin-bottom:6px}
.quiz-cat-card p{font-size:13px;color:var(--mut)}

/* QUIZ PLAY */
.quiz-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;max-width:560px;margin:0 auto}
.hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;color:var(--mut)}
.hud b{color:var(--cy)}
.progress-wrap{height:6px;background:#1a1a26;border-radius:10px;margin-bottom:18px;overflow:hidden}
.progress-fill{height:100%;background:var(--cy);border-radius:10px;transition:width .3s}
.q-badge{display:inline-block;background:var(--cyd);color:#001;font-size:12px;font-weight:700;border-radius:20px;padding:3px 12px;margin-bottom:10px}
.q-text{font-size:16px;font-weight:700;line-height:1.6;margin-bottom:14px}
.q-formula{font-size:13px;color:var(--cy);margin-bottom:16px}
.answer-row{display:flex;gap:10px;margin-bottom:12px}
.answer-row input{flex:1;background:#1a1a26;border:2px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--tx);font-family:'Sarabun',sans-serif;font-size:15px}
.answer-row input:focus{outline:none;border-color:var(--cy)}
.btn-answer{background:var(--cyd);color:#001;border:none;border-radius:10px;padding:0 22px;font-weight:800;font-family:'Sarabun',sans-serif;cursor:pointer;font-size:15px}
.feedback{border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.7;display:none;margin-bottom:12px}
.feedback.ok{background:rgba(34,197,94,.12);color:#4ade80;border:1.5px solid var(--gr)}
.feedback.ng{background:rgba(244,63,94,.12);color:#fb7185;border:1.5px solid var(--rd)}
.btn-next{display:none;width:100%;background:var(--cyd);color:#001;border:none;border-radius:10px;padding:12px;font-weight:800;font-family:'Sarabun',sans-serif;cursor:pointer;font-size:15px}

/* RESULT */
.result-emoji{font-size:52px;text-align:center;margin-bottom:6px}
.result-grade{text-align:center;font-size:26px;font-weight:800;margin-bottom:4px}
.result-score{text-align:center;font-size:15px;color:var(--mut);margin-bottom:16px}
.bar-wrap{background:#1a1a26;border-radius:20px;height:12px;margin-bottom:18px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--cyd),var(--cy));border-radius:20px;transition:width 1s ease}
.btn-replay{display:block;width:100%;background:linear-gradient(135deg,var(--cyd),var(--cy));color:#001;border:none;border-radius:10px;padding:14px;font-size:16px;font-weight:800;font-family:'Sarabun',sans-serif;cursor:pointer}

/* CALCULATOR */
.calc-fab{position:fixed;right:20px;bottom:20px;width:56px;height:56px;border-radius:50%;background:var(--cy);color:#001;border:none;font-size:26px;cursor:pointer;box-shadow:0 6px 20px rgba(34,211,238,.4);z-index:1000;display:flex;align-items:center;justify-content:center}
.calc-fab:active{transform:scale(.94)}
.calc-panel{position:fixed;right:20px;bottom:86px;width:260px;background:var(--card);border:1px solid var(--cyd);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.6);z-index:1000;display:none;overflow:hidden}
.calc-panel.open{display:block}
.calc-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.calc-head span{font-size:13px;font-weight:700;color:var(--cy)}
.calc-head button{background:none;border:none;color:var(--mut);font-size:18px;cursor:pointer;line-height:1}
.calc-display{padding:14px;text-align:right}
.calc-expr{font-size:12px;color:var(--mut);min-height:16px;overflow-x:auto;white-space:nowrap}
.calc-value{font-size:26px;font-weight:800;color:var(--tx);overflow-x:auto;white-space:nowrap}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line)}
.calc-grid button{background:#1a1a26;color:var(--tx);border:none;padding:14px 0;font-size:15px;font-weight:700;font-family:'Sarabun',sans-serif;cursor:pointer}
.calc-grid button:active{background:#232336}
.calc-grid button.op{color:var(--cy)}
.calc-grid button.eq{background:var(--cyd);color:#001}
.calc-grid button.clr{color:var(--rd)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="s-login" class="screen active">
  <div class="login-card">
    <div class="login-h1">⚙️ ระบบส่งกำลังและความเร็วรอบ</div>
    <div class="login-sub">ครูผู้สอน ธานี ชมสุข — สัปดาห์ที่ 10-14</div>
    <div class="field"><label>ชื่อ (First Name)</label><input id="fname" placeholder="กรอกชื่อ..."></div>
    <div class="field"><label>นามสกุล (Last Name)</label><input id="lname" placeholder="กรอกนามสกุล..."></div>
    <div class="field"><label>แผนก / ชั้นปี (Department / Class)</label><input id="dept" placeholder="เช่น ช่างกล 1/1..."></div>
    <button class="btn-primary" onclick="login()">เข้าสู่ระบบ (Enter)</button>
  </div>
</div>

<!-- MAIN -->
<div id="s-main" class="screen">
  <div class="wrap">
    <div class="topbar">
      <div>
        <h1>⚙️ ระบบส่งกำลังและความเร็วรอบ</h1>
        <div class="sub" id="userline"></div>
      </div>
      <div class="nav-btns">
        <button class="nav-btn" id="btn-learn" onclick="setMode('learn')">📖 เรียนรู้ (Learn)</button>
        <button class="nav-btn" id="btn-quiz" onclick="setMode('quiz')">▶ ทดสอบ (Quiz)</button>
      </div>
    </div>

    <!-- LEARN VIEW -->
    <div id="view-learn">
      <div class="week-tabs" id="learn-week-tabs"></div>
      <div class="week-title" id="learn-week-title"></div>
      <div class="week-desc" id="learn-week-desc"></div>
      <div id="learn-sim"></div>
      <div class="topic-grid" id="learn-topics"></div>
    </div>

    <!-- QUIZ PRE-SCREEN -->
    <div id="view-quiz-pre">
      <h2 style="margin-bottom:16px">เลือกหมวดหมู่ที่ต้องการทดสอบ</h2>
      <div class="quiz-cats" id="quiz-cats"></div>
    </div>

    <!-- QUIZ PLAY -->
    <div id="view-quiz-play">
      <div class="quiz-card">
        <div class="hud"><span id="hud-progress"></span><b id="hud-score">0 คะแนน</b></div>
        <div class="progress-wrap"><div class="progress-fill" id="prog" style="width:0%"></div></div>
        <div class="q-badge" id="q-badge"></div>
        <div class="q-text" id="q-text"></div>
        <div class="q-formula" id="q-formula"></div>
        <div class="answer-row">
          <input type="number" step="any" id="ans-input" placeholder="พิมพ์คำตอบ..." onkeydown="if(event.key==='Enter')submitAnswer()">
          <button class="btn-answer" onclick="submitAnswer()">ตอบ</button>
        </div>
        <div class="feedback" id="feedback"></div>
        <button class="btn-next" id="btn-next" onclick="nextQuestion()">ข้อถัดไป →</button>
      </div>
    </div>

    <!-- QUIZ RESULT -->
    <div id="view-quiz-result">
      <div class="quiz-card">
        <div class="result-emoji" id="r-emoji">🏆</div>
        <div class="result-grade" id="r-grade"></div>
        <div class="result-score" id="r-score"></div>
        <div class="bar-wrap"><div class="bar-fill" id="r-bar" style="width:0%"></div></div>
        <button class="btn-replay" onclick="backToQuizPre()">🔄 เริ่มใหม่</button>
      </div>
    </div>
  </div>
</div>

<!-- CALCULATOR -->
<button class="calc-fab" id="calc-fab" onclick="toggleCalc()">🧮</button>
<div class="calc-panel" id="calc-panel">
  <div class="calc-head"><span>เครื่องคิดเลข</span><button onclick="toggleCalc()">✕</button></div>
  <div class="calc-display">
    <div class="calc-expr" id="calc-expr">&nbsp;</div>
    <div class="calc-value" id="calc-value">0</div>
  </div>
  <div class="calc-grid">
    <button class="clr" onclick="calcClear()">C</button>
    <button onclick="calcPi()">π</button>
    <button onclick="calcBackspace()">⌫</button>
    <button class="op" onclick="calcOp('÷')">÷</button>
    <button onclick="calcDigit('7')">7</button>
    <button onclick="calcDigit('8')">8</button>
    <button onclick="calcDigit('9')">9</button>
    <button class="op" onclick="calcOp('×')">×</button>
    <button onclick="calcDigit('4')">4</button>
    <button onclick="calcDigit('5')">5</button>
    <button onclick="calcDigit('6')">6</button>
    <button class="op" onclick="calcOp('-')">−</button>
    <button onclick="calcDigit('1')">1</button>
    <button onclick="calcDigit('2')">2</button>
    <button onclick="calcDigit('3')">3</button>
    <button class="op" onclick="calcOp('+')">+</button>
    <button onclick="calcDigit('0')">0</button>
    <button onclick="calcDot()">.</button>
    <button class="eq" onclick="calcEquals()" style="grid-column:span 2">=</button>
  </div>
</div>

<script>
// ─── HELPERS ─────────────────────────────────────────
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min }

// ─── CONTENT DATA ────────────────────────────────────
const WEEKS = [
  {id:10, label:'สัปดาห์ 10', title:'สัปดาห์ที่ 10 — บทที่ 5', desc:'ความเร็วรอบ ความเร็วตัด และความเร็วขอบ — หลักการคำนวณความเร็วในงานช่าง'},
  {id:11, label:'สัปดาห์ 11', title:'สัปดาห์ที่ 11 — บทที่ 6', desc:'ระบบส่งกำลังด้วยสายพาน — อัตราทดเดี่ยว อัตราทดรวม และสายพานลิ่ม'},
  {id:12, label:'สัปดาห์ 12', title:'สัปดาห์ที่ 12 — บทที่ 7', desc:'ระบบส่งกำลังด้วยเฟือง — เฟืองตรงอัตราทดชั้นเดียว เฟืองกลาง และเฟืองหนอน'},
  {id:13, label:'สัปดาห์ 13', title:'สัปดาห์ที่ 13 — บทที่ 8 (ตอนที่ 1)', desc:'เครื่องผ่อนแรง — คาน โมเมนต์ของแรง และพื้นเอียง'},
  {id:14, label:'สัปดาห์ 14', title:'สัปดาห์ที่ 14 — บทที่ 8 (ตอนที่ 2)', desc:'เครื่องผ่อนแรง — สกรู ลิ่ม และรอกชนิดต่างๆ'},
];

const TOPICS = [
  // ── สัปดาห์ 10 ──
  {id:'cutting_speed', week:10, nameTH:'ความเร็วตัด (Cutting Speed)',
    formula:'Vc = (π × D × n) ÷ 1000  [m/min]',
    desc:'D = เส้นผ่านศูนย์กลางชิ้นงาน/เครื่องมือ (mm), n = ความเร็วรอบ (รอบ/นาที)',
    generate(){
      const D=randInt(20,150), n=randInt(100,2000);
      const Vc=+(Math.PI*D*n/1000).toFixed(2);
      return {question:`เพลากลึงมีเส้นผ่านศูนย์กลาง ${D} mm หมุนด้วยความเร็วรอบ ${n} รอบ/นาที จงหาความเร็วตัด (Vc)`,
        answer:Vc, unit:'m/min',
        steps:`Vc = (3.14 × ${D} × ${n}) ÷ 1000 = ${Vc} m/min`};
    }},
  {id:'rotational_speed', week:10, nameTH:'ความเร็วรอบ (Rotational Speed)',
    formula:'n = (1000 × Vc) ÷ (π × D)  [rpm]',
    desc:'Vc = ความเร็วตัด (m/min), D = เส้นผ่านศูนย์กลาง (mm)',
    generate(){
      const D=randInt(20,150), Vc=randInt(10,80);
      const n=+((1000*Vc)/(Math.PI*D)).toFixed(2);
      return {question:`ต้องการความเร็วตัด ${Vc} m/min บนชิ้นงานเส้นผ่านศูนย์กลาง ${D} mm ต้องตั้งความเร็วรอบ (n) เท่าไร?`,
        answer:n, unit:'rpm',
        steps:`n = (1000 × ${Vc}) ÷ (3.14 × ${D}) = ${n} rpm`};
    }},
  {id:'peripheral_speed', week:10, nameTH:'ความเร็วขอบ (Peripheral Speed)',
    formula:'v = (π × D × n) ÷ 1000  [m/min]',
    desc:'ใช้หลักการเดียวกับความเร็วตัด แต่ประยุกต์กับวัตถุทรงกลมที่หมุน เช่น ล้อ พูลเลย์ เฟือง',
    generate(){
      const D=randInt(50,400), n=randInt(50,1500);
      const v=+(Math.PI*D*n/1000).toFixed(2);
      return {question:`พูลเลย์เส้นผ่านศูนย์กลาง ${D} mm หมุนด้วยความเร็ว ${n} รอบ/นาที จงหาความเร็วขอบ (v)`,
        answer:v, unit:'m/min',
        steps:`v = (3.14 × ${D} × ${n}) ÷ 1000 = ${v} m/min`};
    }},

  // ── สัปดาห์ 11 ──
  {id:'belt_single_ratio', week:11, nameTH:'อัตราทดเดี่ยว (สายพาน)',
    formula:'N1 × D1 = N2 × D2',
    desc:'N1,D1 = รอบ/เส้นผ่านศูนย์กลางมู่เล่ย์ขับ, N2,D2 = รอบ/เส้นผ่านศูนย์กลางมู่เล่ย์ตาม',
    generate(){
      const D1=randInt(50,200), D2=randInt(100,400), N1=randInt(500,3000);
      const N2=+(N1*D1/D2).toFixed(2);
      return {question:`มู่เล่ย์ขับเส้นผ่านศูนย์กลาง ${D1} mm หมุน ${N1} รอบ/นาที ขับมู่เล่ย์ตามเส้นผ่านศูนย์กลาง ${D2} mm จงหาความเร็วรอบมู่เล่ย์ตาม (N2)`,
        answer:N2, unit:'rpm',
        steps:`N2 = N1×D1÷D2 = ${N1}×${D1}÷${D2} = ${N2} rpm`};
    }},
  {id:'belt_overall_ratio', week:11, nameTH:'อัตราทดรวม (สายพาน 2 ชั้น)',
    formula:'N_last = N1 × (D1×D3) ÷ (D2×D4)',
    desc:'ระบบส่งกำลัง 2 ชั้นต่อกัน (ชั้น 1: D1 ขับ D2 ตาม, ชั้น 2: D3 ขับ D4 ตาม อยู่บนเพลาเดียวกับ D2)',
    generate(){
      const D1=randInt(80,150), D2=randInt(150,300), D3=randInt(80,150), D4=randInt(150,300), N1=randInt(1000,3000);
      const Nlast=+(N1*D1*D3/(D2*D4)).toFixed(2);
      return {question:`เพลามอเตอร์หมุน ${N1} รอบ/นาที ผ่านมู่เล่ย์ชั้นที่ 1 (ขับ ${D1} mm ตาม ${D2} mm) แล้วต่อชั้นที่ 2 (ขับ ${D3} mm ตาม ${D4} mm) จงหาความเร็วรอบเพลาสุดท้าย`,
        answer:Nlast, unit:'rpm',

// ─── INTERACTIVE SIMULATORS ──────────────────────────
let simGen = 0; // bumped on every renderSim() so old animation loops self-terminate

function attachDrag(el, svg, cx, cy, onDeltaDeg){
  let dragging = false, lastAngle = 0;
  function angleFor(clientX, clientY){
    const r = svg.getBoundingClientRect();
    const vb = svg.viewBox.baseVal;
    const x = (clientX - r.left) * (vb.width / r.width);
    const y = (clientY - r.top) * (vb.height / r.height);
    return Math.atan2(y - cy, x - cx) * 180 / Math.PI;
  }
  el.style.cursor = 'grab';
  el.addEventListener('pointerdown', e=>{
    dragging = true;
    el.setPointerCapture(e.pointerId);
    lastAngle = angleFor(e.clientX, e.clientY);
    el.style.cursor = 'grabbing';
  });
  el.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const a = angleFor(e.clientX, e.clientY);
    let d = a - lastAngle;
    if(d > 180) d -= 360;
    if(d < -180) d += 360;
    lastAngle = a;
    onDeltaDeg(d);
  });
  el.addEventListener('pointerup', ()=>{ dragging=false; el.style.cursor='grab' });
  el.addEventListener('pointercancel', ()=>{ dragging=false; el.style.cursor='grab' });
}

function externalTangentPoints(x1,y1,r1,x2,y2,r2){
  const dx=x2-x1, dy=y2-y1, d=Math.hypot(dx,dy);
  const baseAngle = Math.atan2(dy,dx);
  const ratio = Math.max(-1, Math.min(1, (r1-r2)/d));
  const beta = Math.acos(ratio);
  const pt = (x,y,r,ang)=>[x+r*Math.cos(ang), y+r*Math.sin(ang)];
  return {
    a1: pt(x1,y1,r1, baseAngle+beta), a2: pt(x2,y2,r2, baseAngle+beta),
    b1: pt(x1,y1,r1, baseAngle-beta), b2: pt(x2,y2,r2, baseAngle-beta),
  };
}

function gearPath(cx, cy, teeth, outerR, innerR){
  const step = 360/teeth;
  let d = '';
  const toXY = (r,angDeg)=>{ const rad=angDeg*Math.PI/180; return [cx+r*Math.cos(rad), cy+r*Math.sin(rad)] };
  for(let i=0;i<teeth;i++){
    const a0 = i*step;
    const p0 = toXY(outerR, a0);
    const p1 = toXY(outerR, a0+step*0.25);
    const p2 = toXY(innerR, a0+step*0.375);
    const p3 = toXY(innerR, a0+step*0.625);
    const p4 = toXY(outerR, a0+step*0.75);
    d += (i===0?`M${p0[0]},${p0[1]} `:`L${p0[0]},${p0[1]} `) + `L${p1[0]},${p1[1]} L${p2[0]},${p2[1]} L${p3[0]},${p3[1]} L${p4[0]},${p4[1]} `;
  }
  return d + 'Z';
}

function renderSim(week){
  simGen++;
  const myGen = simGen;
  const host = document.getElementById('learn-sim');
  host.innerHTML = '';
  if(week===10) setupSim10(host, myGen);
  else if(week===11){ setupSim11(host, myGen); setupSim11b(host, myGen) }
  else if(week===12){ setupSim12(host, myGen); setupSim12b(host, myGen); setupSim12c(host, myGen) }
  else if(week===13){ setupSim13(host, myGen); setupSim13b(host, myGen); setupSim13c(host, myGen) }
  else { setupSim14(host, myGen); setupSim14b(host, myGen); setupSim14c(host, myGen) }
}

function setupSim10(host, myGen){

          <div class="sim-readout">
            Vc = ความเร็วตัด/ความเร็วขอบ = (π×D×n)÷1000<br>
            = <b id="s10-out">-</b> m/min

          <label class="sim-check"><input type="checkbox" id="s10-play" checked> ▶ หมุนอัตโนมัติ</label>
          <div class="sim-hint">ลองลากที่ล้อโดยตรงเพื่อหมุนด้วยมือได้เช่นกัน</div>
        </div>
      </div>
    </div>`;

  const circle = host.querySelector('#s10-circle');
  const spoke = host.querySelector('#s10-spoke');
  const svg = host.querySelector('#s10-svg');
  const rotor = host.querySelector('#s10-rotor');
  const Dslider = host.querySelector('#s10-D');
  const nslider = host.querySelector('#s10-n');
  const Dval = host.querySelector('#s10-Dval');
  const nval = host.querySelector('#s10-nval');
  const out = host.querySelector('#s10-out');
  const playbox = host.querySelector('#s10-play');

  let angle = 0;
  function screenR(D){ return 30 + (D-20)/(150-20)*70 } // map 20-150mm -> 30-100px

  function updateVisual(){
    const D = +Dslider.value, n = +nslider.value;
    Dval.textContent = D; nval.textContent = n;
    const r = screenR(D);
    circle.setAttribute('r', r);
    spoke.setAttribute('y2', 130-r);
    const Vc = (Math.PI*D*n/1000).toFixed(2);

  function loop(t){

          <rect id="s12c-worm" x="25" y="113" width="85" height="34" rx="10" fill="url(#s12c-thread)" stroke="#22d3ee" stroke-width="3"/>
          <g id="s12c-rotor">
            <path id="s12c-gear" fill="rgba(34,211,238,.15)" stroke="#22d3ee" stroke-width="3"/>
            <line id="s12c-spoke" stroke="#f43f5e" stroke-width="4" stroke-linecap="round"/>
          </g>
        </svg>
        <div class="sim-controls">
          <label>จำนวนเกลียวตัวหนอน: <b id="s12c-thval">2</b> เกลียว
            <input type="range" id="s12c-th" min="1" max="4" value="2"></label>
          <label>ฟันเฟืองวงแหวน Tw: <b id="s12c-Twval">36</b> ซี่
            <input type="range" id="s12c-Tw" min="20" max="50" value="36"></label>
          <label>ความเร็วรอบตัวหนอน N_worm: <b id="s12c-Nval">800</b> rpm
            <input type="range" id="s12c-N" min="100" max="3000" value="800"></label>
          <div class="sim-readout">
            N_wheel = N_worm × เกลียว ÷ Tw<br>
            = <b id="s12c-out">-</b> rpm
          </div>
          <label class="sim-check"><input type="checkbox" id="s12c-play" checked> ▶ หมุนอัตโนมัติ</label>
          <div class="sim-hint">แถบเหลืองบนแท่งตัวหนอนไหลแทนการหมุนของเกลียว — ลองลากที่เฟืองวงแหวน (ขวา) ดูได้เช่นกัน</div>
        </div>
      </div>
    </div>`);

  const svg = host.querySelector('#s12c-svg');
  const worm = host.querySelector('#s12c-worm');
  const gear = host.querySelector('#s12c-gear');
  const spoke = host.querySelector('#s12c-spoke');
  const rotor = host.querySelector('#s12c-rotor');
  const pattern = host.querySelector('#s12c-thread');
  const ths = host.querySelector('#s12c-th'), Tws = host.querySelector('#s12c-Tw'), Ns = host.querySelector('#s12c-N');
  const thval = host.querySelector('#s12c-thval'), Twval = host.querySelector('#s12c-Twval'), Nval = host.querySelector('#s12c-Nval');
  const out = host.querySelector('#s12c-out');
  const playbox = host.querySelector('#s12c-play');

  const CY=130;
  let wheelAngle = 0, threadOffset = 0;
  const cxWheel = 175;
  function screenR(Tw){ return 30 + (Tw-20)/(50-20)*40 } // map 20-50 teeth -> 30-70px

  function updateVisual(){
    const threads=+ths.value, Tw=+Tws.value, Nworm=+Ns.value;
    thval.textContent=threads; Twval.textContent=Tw; Nval.textContent=Nworm;
    pattern.setAttribute('width', Math.max(8, 48/threads));
    const rw = screenR(Tw);
    const wormLeft = 25, overlap = 12;
    worm.setAttribute('width', Math.max(30, (cxWheel - rw + overlap) - wormLeft));
    gear.setAttribute('d', gearPath(cxWheel, CY, Tw, rw+7, rw-5));
    spoke.setAttribute('x1',cxWheel); spoke.setAttribute('y1',CY); spoke.setAttribute('x2',cxWheel); spoke.setAttribute('y2',CY-rw);
    const Nwheel = (Nworm*threads/Tw).toFixed(2);
    out.textContent = Nwheel;
    applyGear();
  }
  function applyGear(){ rotor.setAttribute('transform', `rotate(${wheelAngle} ${cxWheel} ${CY})`) }
  function applyThread(){ pattern.setAttribute('patternTransform', `translate(${threadOffset},0)`) }

  ths.addEventListener('input', updateVisual);
  Tws.addEventListener('input', updateVisual);
  Ns.addEventListener('input', updateVisual);
  attachDrag(rotor, svg, cxWheel, CY, d=>{
    const threads=+ths.value, Tw=+Tws.value;
    wheelAngle += d;
    threadOffset += d*(Tw/threads)/360*48; // drive the worm's thread-flow from the wheel side too
    applyGear(); applyThread();
  });

  updateVisual();
  let last=null;
  function loop(t){
    if(myGen !== simGen) return;
    if(last!=null && playbox.checked){
      const dt=(t-last)/1000;
      const threads=+ths.value, Tw=+Tws.value, Nworm=+Ns.value;
      const Nwheel = Nworm*threads/Tw;
      threadOffset += Nworm/60*48*dt; // visual "thread flow" speed tracks worm rpm
      wheelAngle += (Nwheel/60)*360*dt;
      applyGear(); applyThread();
    }
    last=t;
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

// ─── STATE ───────────────────────────────────────────
let mode = 'learn';
let learnWeek = 10;
let g = {};

function login(){
  const fn=document.getElementById('fname').value.trim();
  const ln=document.getElementById('lname').value.trim();
  const dp=document.getElementById('dept').value.trim();
  if(!fn||!ln){ alert('กรุณากรอกชื่อและนามสกุล'); return }
  document.getElementById('userline').textContent = `ผู้ใช้งาน: ${fn} ${ln}${dp?' ('+dp+')':''}`;
  showScreen('s-main');
  buildLearnWeekTabs();
  setMode('learn');
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ─── MODE SWITCH ─────────────────────────────────────
function setMode(m){
  mode = m;
  document.getElementById('btn-learn').className = 'nav-btn'+(m==='learn'?' on':'');
  document.getElementById('btn-quiz').className = 'nav-btn'+(m==='quiz'?' on':'');
  document.getElementById('view-learn').style.display = m==='learn'?'block':'none';
  document.getElementById('view-quiz-pre').style.display = m==='quiz'?'block':'none';
  document.getElementById('view-quiz-play').style.display = 'none';
  document.getElementById('view-quiz-result').style.display = 'none';
  if(m==='quiz'){ simGen++; buildQuizCats() }
  else renderSim(learnWeek);
}

// ─── LEARN VIEW ──────────────────────────────────────
function buildLearnWeekTabs(){
  const wrap = document.getElementById('learn-week-tabs');
  wrap.innerHTML = '';
  WEEKS.forEach(w=>{
    const btn = document.createElement('button');
    btn.className = 'week-tab'+(w.id===learnWeek?' on':'');
    btn.textContent = w.label;
    btn.onclick = ()=>{ learnWeek=w.id; renderLearn() };
    wrap.appendChild(btn);
  });
  renderLearn();
}

function renderLearn(){
  document.querySelectorAll('#learn-week-tabs .week-tab').forEach((b,i)=>{
    b.className = 'week-tab'+(WEEKS[i].id===learnWeek?' on':'');
  });
  const w = WEEKS.find(w=>w.id===learnWeek);
  document.getElementById('learn-week-title').textContent = w.title;
  document.getElementById('learn-week-desc').textContent = w.desc;
  renderSim(learnWeek);

  const grid = document.getElementById('learn-topics');
  grid.innerHTML = '';
  TOPICS.filter(t=>t.week===learnWeek).forEach(t=>{
    const ex = t.generate();
    const card = document.createElement('div');
    card.className = 'topic-card';
    card.innerHTML = `
      <h3>${t.nameTH}</h3>
      <div class="topic-desc">${t.desc}</div>
      <div class="formula-box">สูตร: ${t.formula}</div>
      <div class="example-box">ตัวอย่าง: ${ex.question}<br>วิธีทำ: ${ex.steps} <b>← ${ex.answer} ${ex.unit}</b></div>
    `;
    grid.appendChild(card);
  });
}

// ─── QUIZ PRE-SCREEN ─────────────────────────────────
function buildQuizCats(){
  const wrap = document.getElementById('quiz-cats');
  wrap.innerHTML = '';
  WEEKS.forEach(w=>{
    const card = document.createElement('div');
    card.className = 'quiz-cat-card';
    card.innerHTML = `<h3>${w.label}</h3><p>${w.desc}</p>`;
    card.onclick = ()=>startQuiz(w.id);
    wrap.appendChild(card);
  });
  const allCard = document.createElement('div');
  allCard.className = 'quiz-cat-card';
  const minW = Math.min(...WEEKS.map(w=>w.id)), maxW = Math.max(...WEEKS.map(w=>w.id));
  allCard.innerHTML = `<h3>ทั้งหมด (${minW}-${maxW})</h3><p>สุ่มทุกสัปดาห์คละกัน</p>`;
  allCard.onclick = ()=>startQuiz('all');
  wrap.appendChild(allCard);
}

// ─── QUIZ PLAY ────────────────────────────────────────
function startQuiz(weekFilter){
  const pool = weekFilter==='all' ? TOPICS : TOPICS.filter(t=>t.week===weekFilter);
  const N = 15;
  const qs = [];
  for(let i=0;i<N;i++){
    const topic = pool[Math.floor(Math.random()*pool.length)];
    const q = topic.generate();
    qs.push({topic, ...q});
  }
  g = {qs, cur:0, score:0, correct:0, answered:false};
  document.getElementById('view-quiz-pre').style.display='none';
  document.getElementById('view-quiz-play').style.display='block';
  document.getElementById('view-quiz-result').style.display='none';
  renderQuestion();
}

function renderQuestion(){
  const {qs, cur, score} = g;
  const q = qs[cur];
  document.getElementById('hud-progress').textContent = `ข้อที่ ${cur+1} / ${qs.length}`;
  document.getElementById('hud-score').textContent = `${score} คะแนน`;
  document.getElementById('prog').style.width = (cur/qs.length*100)+'%';
  document.getElementById('q-badge').textContent = `${q.topic.nameTH} (สัปดาห์ ${q.topic.week})`;
  document.getElementById('q-text').textContent = q.question;
  document.getElementById('q-formula').textContent = `(สูตร: ${q.topic.formula})`;
  document.getElementById('ans-input').value = '';
  document.getElementById('ans-input').disabled = false;
  document.getElementById('feedback').style.display = 'none';
  document.getElementById('btn-next').style.display = 'none';
  g.answered = false;
  document.getElementById('ans-input').focus();
}

function checkAnswer(given, expected){
  const tol = Math.max(Math.abs(expected*0.02), 0.05);
  return Math.abs(given-expected) <= tol;
}

function submitAnswer(){
  if(g.answered) return;
  const input = document.getElementById('ans-input');
  const val = parseFloat(input.value);
  if(isNaN(val)) return;
  g.answered = true;
  input.disabled = true;
  const q = g.qs[g.cur];
  const ok = checkAnswer(val, q.answer);
  const fb = document.getElementById('feedback');
  if(ok){
    const pts = 100;
    g.score += pts; g.correct++;
    fb.className = 'feedback ok';
    fb.textContent = `✅ ถูกต้อง! +${pts} คะแนน — ${q.steps}`;
  } else {
    fb.className = 'feedback ng';
    fb.textContent = `❌ ยังไม่ถูก คำตอบที่ถูกคือ ${q.answer} ${q.unit} — ${q.steps}`;
  }
  fb.style.display = 'block';
  document.getElementById('hud-score').textContent = `${g.score} คะแนน`;
  document.getElementById('btn-next').style.display = 'block';
}

function nextQuestion(){
  g.cur++;
  if(g.cur >= g.qs.length) endQuiz();
  else renderQuestion();
}

function endQuiz(){
  const {qs,correct,score} = g;
  const total = qs.length;
  const pct = correct/total*100;
  document.getElementById('view-quiz-play').style.display='none';
  document.getElementById('view-quiz-result').style.display='block';

  let emoji,grade,color;
  if(pct>=90){emoji='🏆';grade='เยี่ยมมาก!';color='#facc15'}
  else if(pct>=75){emoji='⭐';grade='ดีมาก';color='#22d3ee'}
  else if(pct>=60){emoji='👍';grade='ดี';color='#4ade80'}
  else if(pct>=50){emoji='📚';grade='ผ่าน';color='#fb923c'}
  else{emoji='💪';grade='ต้องฝึกเพิ่ม';color='#f43f5e'}

  document.getElementById('r-emoji').textContent = emoji;
  const g2 = document.getElementById('r-grade'); g2.textContent = grade; g2.style.color = color;
  document.getElementById('r-score').textContent = `${correct} / ${total} ข้อ — ${score.toLocaleString()} คะแนน (${pct.toFixed(0)}%)`;
  setTimeout(()=>{ document.getElementById('r-bar').style.width = pct+'%' }, 100);
}

function backToQuizPre(){
  document.getElementById('view-quiz-result').style.display='none';
  document.getElementById('view-quiz-pre').style.display='block';
  buildQuizCats();
}

// ─── CALCULATOR (floating, available in Learn & Quiz) ─
let calcCur='0', calcAcc=null, calcPending=null, calcFresh=false;

function toggleCalc(){ document.getElementById('calc-panel').classList.toggle('open') }
function trimNum(n){ return `${+n.toFixed(6)}` }
function calcRender(){
  document.getElementById('calc-value').textContent = calcCur;
  document.getElementById('calc-expr').innerHTML = calcAcc!=null ? `${trimNum(calcAcc)} ${calcPending}` : '&nbsp;';
}
function calcDigit(d){
  if(calcFresh){ calcCur=d; calcFresh=false }
  else calcCur = calcCur==='0' ? d : calcCur+d;
  calcRender();
}
function calcDot(){
  if(calcFresh){ calcCur='0.'; calcFresh=false; calcRender(); return }
  if(calcCur.indexOf('.')===-1) calcCur += '.';
  calcRender();
}
function calcPi(){ calcCur=String(Math.PI); calcFresh=true; calcRender() }
function calcBackspace(){
  if(calcFresh) return;
  calcCur = calcCur.length>1 ? calcCur.slice(0,-1) : '0';
  calcRender();
}
function calcClear(){ calcCur='0'; calcAcc=null; calcPending=null; calcFresh=false; calcRender() }
function calcCompute(){
  const cur = parseFloat(calcCur);
  if(calcAcc==null) return cur;
  if(calcPending==='+') return calcAcc+cur;
  if(calcPending==='-') return calcAcc-cur;
  if(calcPending==='×') return calcAcc*cur;
  if(calcPending==='÷') return calcAcc/cur;
  return cur;
}
function calcOp(op){
  calcAcc = calcCompute();
  calcPending = op;
  calcCur = trimNum(calcAcc);
  calcFresh = true;
  calcRender();
}
function calcEquals(){
  const result = calcCompute();
  calcCur = trimNum(result);
  calcAcc = null;
  calcPending = null;
  calcFresh = true;
  calcRender();
}
